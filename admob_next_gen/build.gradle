plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'com.robining.games.ads.nextgen'
    compileSdk = 37

    publishing {
        singleVariant("release") {}
    }

    defaultConfig {
        // GMA Next-Gen SDK requires Android API 24 or higher.
        minSdk = 24
        targetSdk = 36
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
}

task sourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifact sourcesJar
                groupId = 'com.github.karsonluos.agame-common'
                artifactId = 'admob-next-gen'
                version = "${LIB_VERSION}"
            }
        }
        repositories {
            mavenLocal()
        }
    }
}

dependencies {
    api project(":iads")
    api libs.ads.mobile.sdk.next
    compileOnly project(":frame")
}
